<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light only">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FFMPA">
<meta name="format-detection" content="telephone=no">
<title>FFMPA Kids News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout idea: one story per screen, swiped like a deck (Inshorts style). Bloom family look: warm white, ink, electric violet, saffron; Geist with Instrument Serif italic accents; line icons; photo-first cards. */
:root{
  --sky:#F4F4F6; --paper:#FFFFFF; --ink:#0E0D12; --muted:#6B6A74; --line:#ECECF0;
  --brand:#5B35E8; --brand-deep:#3F22B5; --brand-soft:#F3F0FF;
  --sun:#FFB020; --local:#FF5A3C; --world:#1A7A4B; --world-soft:#E9F6EE; --local-soft:#FFF0EC; --focus:#5B35E8;
  --display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --voice:"Instrument Serif",ui-serif,Georgia,serif;
  --fs:16.5px; color-scheme:light;
}
html.explorers{--fs:19px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#FFFFFF;color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:var(--brand)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
em.v{font-family:var(--voice);font-style:italic;font-weight:400;color:var(--brand);letter-spacing:0}
.press{transition:transform .14s cubic-bezier(.3,1.4,.5,1)}.press:active{transform:scale(.94)}

.app{position:relative;height:100%;max-width:460px;margin:0 auto;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.045em;border:0;background:none;color:var(--ink);padding:0}
.mini-sun{width:20px;height:20px;border-radius:50%;background:conic-gradient(from 200deg,#7B5CFF,#5B35E8,#FF7A59,#FFB020,#7B5CFF);box-shadow:0 2px 8px -2px rgba(91,53,232,.5);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(12px);opacity:.2}to{transform:none;opacity:1}}
.top-r{display:flex;align-items:center;gap:6px}
.pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill svg.i{width:16px;height:16px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);box-shadow:0 6px 14px -8px rgba(14,13,18,.6);color:#fff;display:grid;place-items:center}
.hello-bar{background:var(--paper);padding:0 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hello-bar h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.04em;line-height:1.1}
.goalchip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.goalchip i{display:block;width:64px;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.goalchip i b{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s}
.rail{display:flex;gap:7px;overflow-x:auto;padding:4px 14px 12px;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rchip{border:1px solid var(--line);background:#fff;color:#2A2930;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.rchip svg.i{width:16px;height:16px}
.rchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.deck{position:relative;flex:1;overflow:hidden;touch-action:pan-x}
.slide{position:absolute;inset:0;padding:14px 14px 0;transition:transform .5s cubic-bezier(.22,.9,.24,1);will-change:transform}
.card{height:100%;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(14,13,18,.04),0 24px 48px -28px rgba(30,20,80,.22)}
.img{position:relative;flex:0 0 41%;min-height:170px;margin:8px 8px 0;border-radius:24px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#F6F4FF,#EEF0F7)}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img .ph{display:grid;place-items:center;gap:10px;color:#6E58E8;text-align:center;font-size:12.5px;font-weight:600;padding:0 30px}
.img .ph svg.i{width:56px;height:56px;stroke-width:1.1}
.img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(22,19,28,.45));pointer-events:none}
.credit{position:absolute;left:12px;bottom:10px;z-index:2;color:#fff;font-size:11.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.credit a{color:#fff}
.tags{position:absolute;left:12px;right:84px;top:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:5px 10px;color:var(--ink);background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(14,13,18,.06);display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(6px)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tag.local::before{background:var(--local)}.tag.global::before{background:var(--world)}.tag.new::before{background:var(--brand)}.tag.cal::before{background:var(--sun)}
.cbody{flex:1;overflow:auto;padding:16px 22px 10px;font-size:var(--fs)}
.kicker{font-family:var(--voice);font-style:italic;font-size:1.12em;color:var(--brand);margin:0 0 4px}
.cbody h2{font-family:var(--display);font-weight:700;font-size:1.56em;line-height:1.08;letter-spacing:-.04em;margin:0 0 12px;text-wrap:balance}
.cbody p{margin:0 0 10px;color:#3A3942}
.term{border:0;padding:0 1px;font-weight:600;color:var(--ink);background:linear-gradient(transparent 62%,var(--tc,#E9E3FF) 62%);border-radius:2px}
.term:hover{background:var(--tc,#FFE3A6)}

/* motion: lively but calm */
@property --hl{syntax:'<percentage>';inherits:false;initial-value:62%}
.slide .card{transition:transform .5s cubic-bezier(.22,.9,.24,1),opacity .5s}
.slide:not(.live) .card{transform:scale(.94);opacity:.55}
.slide.live .acc{transform-origin:left;animation:accIn .8s .05s cubic-bezier(.2,.8,.2,1) both}
@keyframes accIn{from{transform:scaleX(0)}to{transform:none}}
.slide.live .tags .tag{animation:popIn .5s .12s cubic-bezier(.3,1.5,.5,1) both}
.slide.live .tags .tag+.tag{animation-delay:.2s}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}
.slide.live .img img{animation:kenb 10s ease-out both}
@keyframes kenb{from{transform:scale(1.08)}to{transform:scale(1)}}
.slide.live .img .ph svg.i{animation:drift 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.slide.live .cbody>*{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.slide.live .cbody>*:nth-child(1){animation-delay:.08s}.slide.live .cbody>*:nth-child(2){animation-delay:.14s}.slide.live .cbody>*:nth-child(3){animation-delay:.22s}.slide.live .cbody>*:nth-child(4){animation-delay:.3s}.slide.live .cbody>*:nth-child(5){animation-delay:.38s}.slide.live .cbody>*:nth-child(n+6){animation-delay:.46s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.term{background:linear-gradient(transparent var(--hl),var(--tc,#E9E3FF) var(--hl))}
.slide.live .term{animation:hlIn .7s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hlIn{from{--hl:100%}to{--hl:62%}}
.term:hover,.term:focus-visible{--hl:0%;transition:--hl .25s}
.slide.live .kbox:not(.re) .bars i{animation:barIn 1s .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes barIn{from{width:0}}
.slide.live .kbox:not(.re) .tl button i{animation:popIn .45s cubic-bezier(.3,1.5,.5,1) both}
.slide.live .kbox:not(.re) .tl button:nth-child(2) i{animation-delay:.08s}.slide.live .kbox:not(.re) .tl button:nth-child(3) i{animation-delay:.16s}.slide.live .kbox:not(.re) .tl button:nth-child(4) i{animation-delay:.24s}
.slide.live .kbox:not(.re) .scale button{animation:popIn .4s cubic-bezier(.3,1.5,.5,1) both}
.slide.live .kbox:not(.re) .scale button:nth-child(2){animation-delay:.05s}.slide.live .kbox:not(.re) .scale button:nth-child(3){animation-delay:.1s}.slide.live .kbox:not(.re) .scale button:nth-child(4){animation-delay:.15s}.slide.live .kbox:not(.re) .scale button:nth-child(5){animation-delay:.2s}.slide.live .kbox:not(.re) .scale button:nth-child(6){animation-delay:.25s}
.kbox .kt{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
.kbox button{transition:background .2s,color .2s,border-color .2s,transform .15s}
.kbox button:active{transform:scale(.95)}
.kbox .opts2 button.ok{animation:okPulse .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes okPulse{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
.kbox .opts2 button.no{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rchip{transition:background .25s,color .25s,border-color .25s,transform .14s}
.counter.bump{animation:popIn .35s cubic-bezier(.3,1.5,.5,1)}
.hello-bar h1{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.goalchip i b{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.overlay{transition:opacity .25s}
.sheet>*:not(.x):not(.grab){animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.sheet .x{z-index:5}
.sheet>*:nth-child(3){animation-delay:.05s}.sheet>*:nth-child(4){animation-delay:.1s}.sheet>*:nth-child(n+5){animation-delay:.14s}
.endcard>*{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.endcard>*:nth-child(2){animation-delay:.1s}.endcard>*:nth-child(3){animation-delay:.2s}.endcard>*:nth-child(4){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.slide *,.sheet>*,.endcard>*,.hello-bar h1,.counter{animation:none!important;transition:none!important}.slide:not(.live) .card{transform:none;opacity:1}}
/*EXTRACSS*/
/* v2: calm topic colour + word colour + key boxes */
.card .acc{height:4px;background:var(--acc,#5B35E8);flex:none}
.card[style*="--tint"] .img{background:var(--tint)}
.card[style*="--tint"] .img .ph{color:var(--acc)}
.card[style*="--tint"] .img:not(:has(img)) .credit{color:var(--acc)}
.tag.topic{background:var(--tint);color:var(--acc);font-weight:700}
.tag.topic::before{display:none}
.kicker{color:var(--acc,var(--brand))}
.rchip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.rchip[aria-pressed="true"] .cdot{box-shadow:0 0 0 2px #fff}
.term.on{background:var(--tc)}
.tpanel{display:none;border-radius:16px;background:#F7F7F9;padding:11px 13px;margin:2px 0 12px}
.tpanel.open{display:block;animation:tpin .22s ease}
@keyframes tpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tpanel .tk{display:flex;align-items:center;gap:6px;font-size:.7em;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.tpanel .tk i{width:8px;height:8px;border-radius:50%}
.tpanel b{display:block;font-size:.95em;margin:3px 0 2px}
.tpanel p{margin:0 0 8px;font-size:.86em;line-height:1.45;color:#3A3942}
.tpanel .tb{display:flex;gap:8px}
.tpanel .tb button{border:1px solid #E4E4EA;background:#fff;border-radius:999px;padding:6px 11px;font-size:.78em;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.tpanel .tb button svg.i{width:14px;height:14px}
.kbox{border-radius:18px;background:var(--tint);padding:12px 13px;margin:4px 0 12px;display:flex;flex-direction:column;gap:8px}
.kbox .kh{font-size:.68em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.kbox .kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kbox .kv b{font-family:var(--display);font-size:1.75em;letter-spacing:-.04em;color:var(--acc);line-height:1}
.kbox .kv span{font-size:.84em;color:#2F2E36;line-height:1.35}
.kbox .kt{font-size:.8em;color:#3A3942;line-height:1.45;margin:0}
.kbox .scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.kbox .scale button{height:8px;border:0;padding:0;border-radius:4px}
.kbox .scale button.on{outline:2px solid var(--ink);outline-offset:2px}
.kbox .seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:3px}
.kbox .seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-size:.74em;font-weight:600;color:#3A3942}
.kbox .seg button.on{background:var(--acc);color:#fff}
.kbox .bars{display:flex;flex-direction:column;gap:4px}
.kbox .bars div{height:8px;border-radius:4px;background:#fff;overflow:hidden}
.kbox .bars i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.kbox .bars div+div i{background:color-mix(in srgb,var(--acc) 40%,#fff)}
.kbox .tl{display:grid;position:relative}
.kbox .tl::before{content:"";position:absolute;left:12%;right:12%;top:6px;height:2px;background:color-mix(in srgb,var(--acc) 30%,#fff)}
.kbox .tl button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:.74em;font-weight:500;color:#6B6A74}
.kbox .tl button i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid color-mix(in srgb,var(--acc) 55%,#fff);box-sizing:border-box}
.kbox .tl button.on{color:var(--acc);font-weight:700}
.kbox .tl button.on i{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,#fff)}
.kbox .chips{display:flex;gap:6px;flex-wrap:wrap}
.kbox .chips button{border-radius:999px;padding:7px 12px;font-size:.76em;font-weight:600;background:#fff;border:1.5px solid color-mix(in srgb,var(--acc) 25%,#fff)}
.kbox .chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kbox .opts2{display:flex;gap:8px}
.kbox .opts2 button{flex:1;border-radius:14px;padding:11px;font-size:.9em;font-weight:600;background:#fff;border:1.5px solid color-mix(in srgb,var(--acc) 25%,#fff)}
.kbox .opts2 button.ok{background:#DCF5E6;border-color:#16A34A}
.kbox .opts2 button.no{background:#FDE8E8;border-color:#DC2626}
.kbox .fb{font-size:.82em;font-weight:600}

.srcbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 22px;font-size:13px;color:var(--muted);background:var(--paper);border:0;border-top:1px solid var(--line);width:100%;text-align:left}
.srcbar b{color:var(--ink);font-weight:600}
.srcbar .go{color:var(--brand);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.dock{display:flex;justify-content:space-around;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);min-width:58px;padding:4px;border-radius:14px}
.dock button svg.i{width:22px;height:22px;stroke-width:1.7}
.dock button:hover{color:var(--brand)}
.dock #dQuiz{color:var(--brand)}
.navbtns{display:none}
@media (hover:hover) and (min-width:700px){.navbtns{position:fixed;left:calc(50% + 248px);bottom:110px;display:flex;flex-direction:column;gap:10px;z-index:3}}
.navbtns button{width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 24px -12px rgba(40,20,90,.5)}
.navbtns button:disabled{opacity:.35}
.counter{position:absolute;right:24px;top:24px;z-index:3;background:rgba(22,19,28,.78);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;backdrop-filter:blur(6px)}

.ad .img{flex-basis:34%;background:linear-gradient(160deg,#F7F7F9,#EEEEF2)}
.ad .img::after{display:none}
.adlabel{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;margin-bottom:10px}
.endcard{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;background:#fff}
.endcard h2{font-family:var(--display);font-weight:700;font-size:2em;margin:0;letter-spacing:-.04em;line-height:1.05}
.endcard p{margin:0;color:var(--muted);max-width:32ch}
.moon{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 62% 38%,#fff 0 30%,transparent 31%),linear-gradient(135deg,#7B5CFF,#3F22B5);box-shadow:0 20px 40px -18px rgba(63,34,181,.7)}

.overlay{position:fixed;inset:0;background:rgba(14,13,18,.42);display:none;z-index:50;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:460px;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;box-shadow:0 -20px 60px -20px rgba(14,13,18,.25);position:relative;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(50px);opacity:.3}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:1.55em;margin:0 0 6px;letter-spacing:-.03em;padding-right:44px;line-height:1.1}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--sky);display:grid;place-items:center}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px}
.box{border-radius:20px;padding:15px 17px;margin:12px 0 0;border:1px solid var(--line)}
.box h4{margin:0 0 4px;font-family:var(--voice);font-style:italic;font-weight:400;font-size:1.2em}
.box p{margin:0}
.box.where{background:#fff}
.box.where h4{color:#B23A20}
.box.think{background:#FAF9FF;border-color:#E7E1FF}
.box.think h4{color:var(--brand-deep)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:600;background:var(--ink);color:#fff;font-size:15px;letter-spacing:-.01em}
.btn.sun{background:var(--ink);color:#fff;box-shadow:0 10px 22px -12px rgba(14,13,18,.6)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ttype{display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:4px 10px}
.list{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px}
.item b{font-family:var(--display);font-weight:700}
.item p{margin:4px 0 0;font-size:.95em;color:var(--muted)}
.menu{display:grid;gap:8px}
.menu button,.menu a{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px 15px;text-align:left;text-decoration:none;color:var(--ink);font-weight:600}

@keyframes ffhop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-5px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}}

.wm b{display:inline-block;font-weight:700;animation:ffpop .7s cubic-bezier(.3,1.7,.5,1) both}
.wm b:nth-child(1){color:#5B35E8;animation-delay:.05s}
.wm b:nth-child(2){color:#FF5A3C;animation-delay:.12s}
.wm b:nth-child(3){color:#F59A00;animation-delay:.19s}

@keyframes ffpop{from{transform:translateY(60%) scale(.4);opacity:0}to{transform:none;opacity:1}}

.lg:hover .buddy,.lg:focus-visible .buddy{animation:ffhop .7s cubic-bezier(.3,1.4,.5,1)}

.lg:hover .wm b:nth-child(2){animation-delay:.05s}.lg:hover .wm b:nth-child(3){animation-delay:.1s}.lg:hover .wm b:nth-child(4){animation-delay:.15s}.lg:hover .wm b:nth-child(5){animation-delay:.2s}

.wsun{width:auto;height:auto;margin-bottom:18px}.wsun .buddy{width:84px;height:84px;filter:drop-shadow(0 14px 22px rgba(91,53,232,.28))}

  else if(topic.startsWith("c:")) list=list.filter(s=>s.cat===topic.slice(2));

  if(ps.paid && !ps.sub && ps.left<=0 && !(session&&session.preview)){ deck=[{type:"paywall"}]; return; }

  list.forEach((s,i)=>{

    if(ads.length && (i+1)%ADMIN.ads.every===0 && i<list.length-1 && shown<ADMIN.ads.maxPerEdition){ out.push({type:"ad", a:ads[shown%ads.length]}); shown++; }

function go(n){

  afterMove();
}

/* gestures */
(function(){
  const d=$("#deck"); let y0=null,x0=null,t0=0,lock=false;
  let drag=null;
  const slideAt=i=>d.querySelector(`.slide[data-i="${i}"]`);
  d.addEventListener("touchstart",e=>{ if(e.touches.length>1){ drag=null; return; } const t=e.touches[0]; drag={y0:t.clientY,x0:t.clientX,t0:Date.now(),axis:null,on:false,dy:0,body:e.target.closest(".cbody"),inMoms:!!e.target.closest(".moms")}; },{passive:true});
  d.addEventListener("touchmove",e=>{
    if(!drag) return; const t=e.touches[0], dy=t.clientY-drag.y0, dx=t.clientX-drag.x0;
    if(!drag.axis){ if(Math.abs(dy)<8&&Math.abs(dx)<8) return; drag.axis=Math.abs(dy)>Math.abs(dx)?"y":"x";
      if(drag.axis==="y"){ const b=drag.body; const atEdge=!b||b.scrollHeight<=b.clientHeight+2||(dy<0?b.scrollTop+b.clientHeight>=b.scrollHeight-2:b.scrollTop<=0); drag.on=atEdge; if(drag.on){ d.classList.add("dragging"); drag.base=dy; [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transition="none"; }); } } }
    if(drag.axis!=="y"||!drag.on) return;
    e.preventDefault();
    let m=dy-drag.base; const h=d.clientHeight||1;
    if((m>0&&idx===0)||(m<0&&idx===deck.length-1)) m*=0.3;
    drag.dy=m;
    [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transform=`translateY(calc(${(i-idx)*100}% + ${m}px))`; });
  },{passive:false});
  const endDrag=e=>{
    if(!drag) return; const g=drag; drag=null; d.classList.remove("dragging");
    if(g.on){ [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transition=""; });
      const h=d.clientHeight||1, v=Math.abs(g.dy)/Math.max(1,Date.now()-g.t0);
      if(Math.abs(g.dy)>h*0.16||(Math.abs(g.dy)>40&&v>0.45)) go(idx+(g.dy<0?1:-1));
      else document.querySelectorAll(".slide").forEach(sl=>{ sl.style.transform=`translateY(${(+sl.dataset.i-idx)*100}%)`; });
      return; }
    if(g.axis==="x"&&!g.inMoms&&e.changedTouches&&e.changedTouches[0]){ const dx=e.changedTouches[0].clientX-g.x0, dy=e.changedTouches[0].clientY-g.y0; if(dx<-70&&Math.abs(dx)>Math.abs(dy)*1.5&&deck[idx]&&deck[idx].type==="story") openMore(); }
  };
  d.addEventListener("touchend",endDrag,{passive:true}); d.addEventListener("touchcancel",endDrag,{passive:true});
  d.addEventListener("wheel",e=>{
    const body=e.target.closest(".cbody");
    if(body && body.scrollHeight>body.clientHeight+2){ const atEnd=body.scrollTop+body.clientHeight>=body.scrollHeight-2, atTop=body.scrollTop<=0; if((e.deltaY>0&&!atEnd)||(e.deltaY<0&&!atTop)) return; }
    if(lock||Math.abs(e.deltaY)<18) return; lock=true; setTimeout(()=>lock=false,650);
    go(idx+(e.deltaY>0?1:-1));
  },{passive:true});
})();

      <div class="panel"><h2>Next runs</h2><p style="margin:0">Evening pipeline drafts at 6:15 PM, editor review window 6:15 to 6:55 PM, publish at ${fmtTime(ADMIN.pmTime)} local time in each country.</p></div>`;
  }
  if(admSection==="stories"){
    m.innerHTML=`<h1>Stories</h1><p class="sub">Every story needs editor approval. Expired and filtered stories can never be published.</p>
      <div class="panel"><div class="tablewrap"><table class="adm-table"><thead><tr><th>Story (Thinkers headline)</th><th>Edition</th><th>Date</th><th>Sources</th><th>Status</th><th>Action</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.s.o.t}${r.held?`<br><small style="color:#4B21A6">Filter matched: "${esc(r.held)}"</small>`:""}</td><td>${r.s.scope==="global"?"World":COUNTRIES[r.s.scope].short}</td><td>${r.s.date}${r.s.kind==="calendar"?"<br><small>Explainer</small>":""}</td><td>${r.s.src.length}</td>
        <td><span class="status st-${r.st}">${({published:"Published",draft:"In review",rejected:"Rejected",held:"Held by filter",stale:"Expired"})[r.st]}</span></td>
        <td>${(r.st==="held"||r.st==="stale")?"<small>Not publishable</small>":`<select data-id="${r.s.id}" aria-label="Set status for ${esc(r.s.o.t)}"><option value="published" ${r.st==="published"?"selected":""}>Publish</option><option value="draft" ${r.st==="draft"?"selected":""}>Back to review</option><option value="rejected" ${r.st==="rejected"?"selected":""}>Reject</option></select>`}</td></tr>`).join("")}

  if(admSection==="editions"){

        <label class="field" for="aMax">Most stories per edition: <b id="aMaxV">${ADMIN.maxStories}</b><input type="range" id="aMax" min="8" max="25" value="${ADMIN.maxStories}"></label></div></div>

      { const okT=v=>/^\d{2}:\d{2}$/.test(v)&&+v.slice(0,2)>=4&&+v.slice(0,2)<=22&&+v.slice(3)<60, mins=v=>+v.slice(0,2)*60+ +v.slice(3);
        const a=$("#aAm").value.trim(), p=$("#aPm").value.trim();
        if(!okT(a)||!okT(p)||mins(p)-mins(a)<660||mins(p)-mins(a)>780){ $("#aMsg").textContent="Use times between 04:00 and 22:59, with the evening edition 11 to 13 hours after the morning edition (for example 06:00 and 19:00). Nothing was saved."; return; } }

        <div class="row" style="margin-top:12px"><label class="field" for="bwIn" style="flex:1">Add a word<input type="text" id="bwIn" placeholder="e.g. scary"></label><button class="btn press" id="bwAdd" style="align-self:flex-end">Add</button></div>

    $("#bwAdd").onclick=()=>{ const w=$("#bwIn").value.trim().toLowerCase(); if(!w||ADMIN.blockedWords.includes(w)) return; ADMIN.blockedWords.push(w); saveAdmin(); renderAdmin(); };

  if(admSection==="ads"){
    const a=ADMIN.ads;
    m.innerHTML=`<h1>Ads and sponsors</h1><p class="sub">Contextual only: the same message for every child in a country, never based on who the child is or what they read. Targeted advertising to children is prohibited under India's DPDP Act.</p>

        <label class="field" for="adEvery">Stories between sponsor cards: <b id="adEveryV">${a.every}</b><input type="range" id="adEvery" min="3" max="10" value="${a.every}"></label>

      <div class="panel"><h2>Ad sources</h2><div class="toggles">

        ${a.sources.adsense?`<div class="code">&lt;ins class="adsbygoogle"

  data-ad-slot="XXXXXXXXXX"
  data-tag-for-child-directed-treatment="1"&gt;&lt;/ins&gt;</div>`:""}</div>
      <div class="panel"><h2>Blocked ad categories</h2><div class="tagin">${a.blocked.map(b=>`<span>${esc(b)}</span>`).join("")}</div></div>
      <div class="panel"><h2>Sponsor cards</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Sponsor message</th><th>Countries</th><th>Status</th><th>Action</th></tr></thead><tbody>
        ${ADMIN.sponsors.map(s=>`<tr><td><b>${esc(s.headline)}</b><br><small>${esc(s.name)}</small>${s.note?`<br><small style="color:#9B2C1F">${esc(s.note)}</small>`:""}</td><td>${s.countries.join(", ")}</td><td><span class="status st-${s.status==="approved"?"published":s.status==="rejected"?"rejected":"draft"}">${s.status}</span></td>

      <div class="row"><button class="btn sun press" id="adSave">Save ad settings</button><span class="msg" id="adMsg" aria-live="polite"></span></div>`;
    $("#adEvery").oninput=e=>$("#adEveryV").textContent=e.target.value; $("#adMax").oninput=e=>$("#adMaxV").textContent=e.target.value;

    $("#adSave").onclick=()=>{ Object.assign(a,{enabled:$("#adOn").checked, explorers:$("#adX").checked, every:+$("#adEvery").value, maxPerEdition:+$("#adMax").value}); Object.assign(a.sources,{direct:$("#srcD").checked, superawesome:$("#srcS").checked, adsense:$("#srcG").checked}); saveAdmin(); $("#adMsg").textContent="Saved. Swipe the app to see sponsor cards."; };
  }
  if(admSection==="plans"){
    const p=ADMIN.plan;
    m.innerHTML=`<h1>Plans and pricing</h1><p class="sub">FFMPA stays free until you switch this on. Families who join while it is free can be kept free for life as early supporters.</p>
      <div class="panel"><h2>Mode</h2><div class="toggles">
        <label class="tg" for="plFree"><input type="radio" name="plMode" id="plFree" value="free" ${p.mode==="free"?"checked":""}> Free for everyone (now)</label>
        <label class="tg" for="plPaid"><input type="radio" name="plMode" id="plPaid" value="paid" ${p.mode==="paid"?"checked":""}> Paid, with a free trial</label>
        <label class="tg" for="plEarly"><input type="checkbox" id="plEarly" ${p.keepFreeForEarly?"checked":""}> Keep families who joined during the free period free for life</label></div></div>
      <div class="panel"><h2>Prices (per family, per year)</h2><div class="toggles">
        <label class="field" for="plIN">India (₹)<input type="number" id="plIN" min="0" value="${p.priceIN}"></label>
        <label class="field" for="plIntl">All other countries (US$)<input type="number" id="plIntl" min="0" step="0.5" value="${p.priceIntl}"></label>
        <label class="field" for="plTrial">Free trial (days)<input type="number" id="plTrial" min="0" max="60" value="${p.trialDays}"></label></div>
        <p class="sub" style="margin:10px 0 0">One plan covers every child on the parent's account.</p></div>
      <div class="panel"><h2>Payment gateways</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Region</th><th>Gateway</th><th>Status</th></tr></thead><tbody>
        <tr><td>India (UPI, cards, netbanking)</td><td><select id="plGIN"><option value="razorpay" ${p.gatewayIN==="razorpay"?"selected":""}>Razorpay</option><option value="stripe" ${p.gatewayIN==="stripe"?"selected":""}>Stripe</option></select></td><td><span class="status st-draft">Keys added at launch</span></td></tr>
        <tr><td>All other countries</td><td><select id="plGX"><option value="stripe" ${p.gatewayIntl==="stripe"?"selected":""}>Stripe</option><option value="razorpay" ${p.gatewayIntl==="razorpay"?"selected":""}>Razorpay</option></select></td><td><span class="status st-draft">Keys added at launch</span></td></tr></tbody></table></div>
        <p class="sub" style="margin:10px 0 0">Payments are taken from the grown-up only, inside the PIN-protected area. Children never see a payment screen. In the Android app, Google Play's billing rules may apply.</p></div>
      <div class="panel"><h2>What families see when paid</h2><p style="margin:0">India: <b>${priceText("IN")}</b> after ${p.trialDays} free days. Elsewhere: <b>${priceText("US")}</b>. When a trial ends, the child sees a friendly card asking them to fetch a grown-up.</p></div>
      <div class="row"><button class="btn sun press" id="plSave">Save pricing</button><span class="msg" id="plMsg" aria-live="polite"></span></div>`;

  if(admSection==="extras"){
    const wk=mondayOf(TODAY()), pz=PUZZLES[wk];
    m.innerHTML=`<h1>Puzzles, crafts and today</h1><p class="sub">The daily pipeline drafts these; editors approve them like stories.</p>
      <div class="panel"><h2>Today card · ${niceDate(TODAY())}</h2>${(()=>{const t=ONTHISDAY[TODAY()]; return t?`<p style="margin:0 0 6px"><b>Born today:</b> ${t.born.map(b=>esc(b.name)+" ("+b.year+")").join(", ")}</p><p style="margin:0"><b>Days:</b> ${t.days.map(d=>esc(d.name)+(d.where?" ["+d.where.join(", ")+"]":"")).join(" · ")}</p>`:"<p>No entries for today yet.</p>";})()}</div>
      ${findsAdminHTML()}<div class="panel"><h2>Learn one thing · this week</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Day</th><th>Subject</th><th>Concept</th></tr></thead><tbody>${LEARN_WEEK.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div><p class="sub" style="margin:10px 0 0">One concept a day, rotating history, geography and science, linked to a story in the edition where possible.</p></div>

      <div class="panel"><h2>Sunday crafts · year one (${CRAFTS.length})</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>#</th><th>Sunday</th><th>Craft</th><th>Theme</th><th>Grown-up</th></tr></thead><tbody>${CRAFTS.map((c,i)=>`<tr><td>${i+1}</td><td>${shortDate(addDays(CRAFT_START,7*i))}</td><td>${esc(c.t)}</td><td>${esc(c.th)}</td><td>${c.g?"Yes":""}</td></tr>`).join("")}</tbody></table></div></div>`;

  if(admSection==="pipeline"){
    m.innerHTML=`<h1>Daily pipeline</h1><p class="sub">Scheduled Claude sessions research and draft each edition, then push drafts to Supabase for editor review.</p>
      <div class="panel"><h2>Each run, twice a day per country</h2><ol style="margin:0;padding-left:20px;line-height:1.7">
        <li>Collect: search trusted sources for news first reported in the last ${ADMIN.freshHours} hours, for the country and the world.</li>
        <li>Select: pick 12 to 20 stories by importance, variety and child relevance; drop blocked topics.</li>
        <li>Verify: confirm each fact in two sources; record source links and dates.</li>
        <li>Write: Explorers and Thinkers versions, the Navigators deeper layer (context, question, jobs), glossary terms, a Think about it question and a quiz question.</li>
        <li>Image: attach only a free-to-use photo (public domain, Creative Commons, or an official press or government library) and record its credit and licence. If none exists, the story runs with its colour band and no photo.</li>
        <li>Screen: run the blocked word list and safety rules; flag anything borderline.</li>
        <li>Push: insert rows into Supabase with status in_review.</li>
        <li>Review: an editor approves in this console; approved stories publish at the edition time.</li></ol></div>
      <div class="panel"><h2>Run log (sample)</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Run</th><th>Drafted</th><th>Held</th><th>Approved</th><th>Result</th></tr></thead><tbody>
        ${Object.entries(COUNTRIES).filter(([k])=>ADMIN.countries[k]).map(([k,c])=>{ const r=rows.filter(x=>x.s.scope===k||x.s.scope==="global"); return `<tr><td>11 Nov · Morning · ${c.short}</td><td>${r.length}</td><td>${r.filter(x=>x.st==="held").length}</td><td>${r.filter(x=>x.st==="published").length}</td><td><span class="status st-published">Published 6:00 AM ${c.tz}</span></td></tr>`; }).join("")}
        <tr><td>11 Nov · Evening · all</td><td>Scheduled</td><td>·</td><td>·</td><td><span class="status st-draft">Runs 6:15 PM local</span></td></tr></tbody></table></div></div>`;

/* ================= Routing ================= */
function route(){
  const k=location.hash.replace("#","");
  if(k==="admin"){ openAdmin(); return; }
  if($("#adminView").classList.contains("open")&&k!=="admin"&&!LEGAL[k]) closeAdmin();
  if(LEGAL[k]) renderLegal(k); else if($("#legalOv").classList.contains("open")) $("#legalOv").classList.remove("open");
}
window.addEventListener("hashchange", route);

/* ================= Boot ================= */
renderAll();
if(SB_ON && session && !session.preview && !(session.uid && store.get(AUTH_KEY,null))){ session=null; _sdel("ffmpa-session"); }
if(location.hash!=="#admin" && (!session||session.preview)){ session=null; startWelcome("email"); }
route();
sbBoot();
</script>
