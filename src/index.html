/* gestures */
(function(){
  const d=$("#deck"); let y0=null,x0=null,t0=0,lock=false;
  let drag=null;
  const slideAt=i=>d.querySelector(`.slide[data-i="${i}"]`);
  d.addEventListener("touchstart",e=>{ if(e.touches.length>1){ drag=null; return; } const t=e.touches[0]; drag={y0:t.clientY,x0:t.clientX,t0:Date.now(),axis:null,on:false,dy:0,body:e.target.closest(".cbody"),inMoms:!!e.target.closest(".moms")}; },{passive:true});
  d.addEventListener("touchmove",e=>{
    if(!drag) return; const t=e.touches[0], dy=t.clientY-drag.y0, dx=t.clientX-drag.x0;
    if(!drag.axis){ if(Math.abs(dy)<8&&Math.abs(dx)<8) return; drag.axis=Math.abs(dy)>Math.abs(dx)?"y":"x";
      if(drag.axis==="y"){ const b=drag.body; const atEdge=!b||b.scrollHeight<=b.clientHeight+2||(dy<0?b.scrollTop+b.clientHeight>=b.scrollHeight-2:b.scrollTop<=0); drag.on=atEdge; if(drag.on){ d.classList.add("dragging"); drag.base=dy; [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transition="none"; }); } } }
    if(drag.axis!=="y"||!drag.on) return;
    e.preventDefault();
    let m=dy-drag.base; const h=d.clientHeight||1;
    if((m>0&&idx===0)||(m<0&&idx===deck.length-1)) m*=0.3;
    drag.dy=m;
    [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transform=`translateY(calc(${(i-idx)*100}% + ${m}px))`; });
  },{passive:false});
  const endDrag=e=>{
    if(!drag) return; const g=drag; drag=null; d.classList.remove("dragging");
    if(g.on){ [idx-1,idx,idx+1].forEach(i=>{ const s=slideAt(i); if(s) s.style.transition=""; });
      const h=d.clientHeight||1, v=Math.abs(g.dy)/Math.max(1,Date.now()-g.t0);
      if(Math.abs(g.dy)>h*0.16||(Math.abs(g.dy)>40&&v>0.45)) go(idx+(g.dy<0?1:-1));
      else document.querySelectorAll(".slide").forEach(sl=>{ sl.style.transform=`translateY(${(+sl.dataset.i-idx)*100}%)`; });
      return; }
    if(g.axis==="x"&&!g.inMoms&&e.changedTouches&&e.changedTouches[0]){ const dx=e.changedTouches[0].clientX-g.x0, dy=e.changedTouches[0].clientY-g.y0; if(dx<-70&&Math.abs(dx)>Math.abs(dy)*1.5&&deck[idx]&&deck[idx].type==="story") openMore(); }
  };
  d.addEventListener("touchend",endDrag,{passive:true}); d.addEventListener("touchcancel",endDrag,{passive:true});
  d.addEventListener("wheel",e=>{
    const body=e.target.closest(".cbody");
    if(body && body.scrollHeight>body.clientHeight+2){ const atEnd=body.scrollTop+body.clientHeight>=body.scrollHeight-2, atTop=body.scrollTop<=0; if((e.deltaY>0&&!atEnd)||(e.deltaY<0&&!atTop)) return; }
    if(lock||Math.abs(e.deltaY)<18) return; lock=true; setTimeout(()=>lock=false,650);
    go(idx+(e.deltaY>0?1:-1));
  },{passive:true});
})();

const BUDDY = '<svg class="buddy" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="url(#ffg)" d="M18 5h12a13 13 0 0 1 13 13v5a13 13 0 0 1-13 13H21l-8.5 7.5V35.2A13 13 0 0 1 5 23v-5A13 13 0 0 1 18 5z"/><g class="eyes"><ellipse cx="19" cy="19.5" rx="3.3" ry="4.1" fill="#fff"/><ellipse cx="29.5" cy="19.5" rx="3.3" ry="4.1" fill="#fff"/><g class="pup"><circle cx="19.9" cy="18.7" r="1.7" fill="#1B1340"/><circle cx="30.4" cy="18.7" r="1.7" fill="#1B1340"/></g></g><path class="smile" d="M19.6 27.4q4.9 4.3 9.8 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path class="spark" fill="#FFB020" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" d="M42 1.8l1.5 3.7 3.7 1.5-3.7 1.5L42 12.2l-1.5-3.7-3.7-1.5 3.7-1.5z"/></svg>';
/* ===================== Local edition schedule =====================
   Editions are approved once (in India) but families see them on their own clock:
   at the morning time (06:00) and the evening time (19:00) in their own time zone,
   the app shows the newest edition that had been published by then. If nothing new
   had been published by a release time, the next edition appears the moment it is
   published, if it is the matching kind (a morning edition at the morning release, an evening edition at
   the evening one) and it lands within 3 hours of the release time. So India's editions, approved around
   6 am and 7 pm, appear as soon as they are ready, while other countries always get theirs at 6:00 and
   7:00. Only the last four days are considered. Release times must be between 04:00 and 23:59.

   log: [{id:"2026-11-13-pm", seen:"2026-11-13T14:44:37Z"}, ...] (from the Cloud Run newsroom)
   Returns {id, slot:"am"|"pm", at:<ms>} or null, where slot and at are the release at which that edition
   appeared for this family (so the label says Morning or Evening on their own clock).
   The same rules live in cloudrun/main.py (visible_edition); tests/schedule_cases.json checks both. */
const FF_LATE_MS=3*3600*1000; /* a late edition skips the queue only within 3 hours of a release time */
function ffTzOffset(ms,tz){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const p={}; f.formatToParts(new Date(ms)).forEach(x=>{ p[x.type]=x.value; });
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(ms/1000)*1000;
}
function ffLocalDate(ms,tz){
  const p={}; new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(ms)).forEach(x=>{ p[x.type]=x.value; });
  return [+p.year,+p.month,+p.day];
}
function ffZoned(y,m,d,hh,mm,tz){ /* local wall time in tz -> UTC ms (handles daylight saving) */
  const guess=Date.UTC(y,m-1,d,hh,mm); let t=guess-ffTzOffset(guess,tz); t=guess-ffTzOffset(t,tz); return t;
}
function ffValidTz(tz){ try{ new Intl.DateTimeFormat("en-US",{timeZone:tz}); return true; }catch(e){ return false; } }
function ffEditionFor(log,nowMs,tz,amTime,pmTime){
  if(!Array.isArray(log)||!log.length) return null;
  if(!tz||!ffValidTz(tz)) tz="Asia/Kolkata";
  /* release times before 04:00 are not allowed: they could fall in a daylight saving gap */
  const hm=s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(s||""); return m&&+m[1]>=4&&+m[1]<=23&&+m[2]<60?[+m[1],+m[2]]:null; };
  const am=hm(amTime)||[6,0], pm=hm(pmTime)||[19,0];
  const L=log.map(e=>({id:e.id,t:Date.parse(e.seen)})).filter(e=>e.id&&!isNaN(e.t)).sort((a,b)=>a.t-b.t);
  if(!L.length) return null;
  const bounds=[]; const [y,mo,d]=ffLocalDate(nowMs,tz);
  for(let back=0;back<=3;back++){ const dt=new Date(Date.UTC(y,mo-1,d-back));
    const Y=dt.getUTCFullYear(), M=dt.getUTCMonth()+1, D=dt.getUTCDate();
    bounds.push({t:ffZoned(Y,M,D,am[0],am[1],tz),slot:"am"},{t:ffZoned(Y,M,D,pm[0],pm[1],tz),slot:"pm"}); }
  const past=bounds.filter(b=>b.t<=nowMs).sort((a,b)=>a.t-b.t);
  if(!past.length) return null;
  const newest=t=>{ let r=null; for(const e of L){ if(e.t<=t) r=e; } return r; };
  /* Walk the release times in order. At each one, show the newest edition published by then if it is newer
     than what is showing. If nothing new arrived at this release, or what is showing is not of this release's
     kind, an edition of this release's kind published within 3 hours shows as soon as it lands. Requiring the
     matching kind is what stops a country from drifting into showing every edition the moment it lands. */
  let shown=null, rel=null;   /* rel: the release at which the edition now showing first appeared (gives the label) */
  for(let i=0;i<past.length;i++){
    const cand=newest(past[i].t);
    let changed=false; if(cand&&(!shown||cand.t>shown.t)){ shown=cand; rel=past[i]; changed=true; }
    if(!changed||!shown.id.endsWith("-"+past[i].slot)){
      const end=Math.min(i===past.length-1?nowMs:past[i+1].t-1, past[i].t+FF_LATE_MS);
      const sT=shown?shown.t:-Infinity;
      let late=null; for(const e of L){ if(e.t<=end&&e.t>sT&&e.id.endsWith("-"+past[i].slot)) late=e; }
      if(late){ shown=late; rel=past[i]; }
    }
  }
  return shown?{id:shown.id,slot:rel.slot,at:rel.t}:null;
}

const DAY=86400000;

const dOf=s=>{ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
const addDays=(s,n)=>isoOf(dOf(s).getTime()+n*DAY);

/* ---------- puzzles ---------- */
let PZ=null;
function pzWeek(){ return mondayOf(TODAY()); }
function pzInit(){
  const set=PUZZLES[pzWeek()]; if(!set) return null;
  const lv=settings.age==="x"?"x":(settings.age==="n"&&set.sudoku.n?"n":"o");
  if(!PZ || PZ.lv!==lv || PZ.week!==pzWeek()){
    const sd=set.sudoku[lv];
    PZ={lv, week:pzWeek(), tab:"sudoku", sd, grid:sd.p.map(r=>r.slice()), sel:null, err:[], solvedS:false, list:set.words[lv]||set.words.o, wi:0, picked:[], bad:false, solvedW:false};
    const done=STATS.puzzles[pzWeek()]||{}; if(done.sudoku){ PZ.solvedS=true; PZ.grid=sd.s.map(r=>r.slice()); } if(done.words){ PZ.solvedW=true; PZ.wi=PZ.list.length; }
  }
  return PZ;
}
function scramble(w){ const a=w.split(""); let seed=[...w].reduce((s,ch)=>s*31+ch.charCodeAt(0),7)>>>0; const rnd=()=>{ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; }; for(let k=0;k<20;k++){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } if(a.join("")!==w) break; } return a; }
function openPuzzles(tab){
  const P=pzInit(); if(!P){ openSheet(`<h2 id="shTitle">Weekly puzzles</h2><p class="sub">New puzzles arrive every Monday.</p>`); return; }
  if(tab) P.tab=tab;
  renderPuzzles();
}
function puzzleSolved(kind){ const w=pzWeek(); STATS.puzzles[w]=STATS.puzzles[w]||{}; if(!STATS.puzzles[w][kind]){ STATS.puzzles[w][kind]=1; saveStats(); checkAch(); } }
function renderPuzzles(){
  const P=PZ, tabs=`<div class="pztabs"><button data-tab="sudoku" class="${P.tab==="sudoku"?"on":""}">Mini sudoku${P.solvedS?" ✓":""}</button><button data-tab="words" class="${P.tab==="words"?"on":""}">News words${P.solvedW?" ✓":""}</button></div>`;
  let body="";
  if(P.tab==="sudoku"){
    const {n,br,bc,p,s}=P.sd;
    const cells=[]; for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const g=p[r][c]!==0, v=P.grid[r][c], sel=P.sel&&P.sel[0]===r&&P.sel[1]===c, same=P.sel&&v&&v===P.grid[P.sel[0]][P.sel[1]], err=P.err.some(e=>e[0]===r&&e[1]===c);
      const bt=r%br===0?2:1, bl=c%bc===0?2:1, bb=r===n-1?2:0, brr=c===n-1?2:0;
      cells.push(`<button type="button" class="cell ${g?"given":""} ${sel?"sel":""} ${same&&!sel?"same":""} ${err?"err":""}" data-r="${r}" data-c="${c}" style="border-top-width:${bt}px;border-left-width:${bl}px;border-bottom-width:${bb}px;border-right-width:${brr}px" aria-label="Row ${r+1}, column ${c+1}${v?", "+v:", empty"}">${v||""}</button>`); }
    body=`<p class="sub" style="margin:4px 0 10px">Fill the grid so every row, column and box has the numbers 1 to ${n} once.</p>
      <div class="sgrid" style="grid-template-columns:repeat(${n},1fr)">${cells.join("")}</div>
      ${P.solvedS?`<div class="pzdone">${ico("trophy")}<b>Solved!</b> Nice thinking. A new puzzle arrives on Monday.</div>`:`<div class="pad">${Array.from({length:n},(_,i)=>`<button type="button" data-v="${i+1}">${i+1}</button>`).join("")}<button type="button" data-v="0" aria-label="Erase">${ico("x")}</button></div><div class="row" style="margin-top:10px"><button class="btn ghost press" id="sdCheck">Check</button><span class="msg" id="sdMsg" aria-live="polite"></span></div>`}`;
  } else {
    if(P.solvedW){ body=`<div class="pzdone">${ico("trophy")}<b>All ${P.list.length} words solved!</b> They all came from this week's stories.</div>`; }
    else {
      const [w,hint]=P.list[P.wi], letters=scramble(w);
      const ans=P.picked.map(i=>letters[i]);
      body=`<p class="sub" style="margin:4px 0 10px">Unscramble words from this week's news. Word ${P.wi+1} of ${P.list.length}.</p>
        <div class="hint">${ico("bulb")}${esc(hint)}</div>
        <div class="slots ${P.bad?"bad":""}">${letters.map((_,i)=>`<button type="button" class="slot" data-u="${i}">${ans[i]||""}</button>`).join("")}</div>
        <div class="tiles">${letters.map((ch,i)=>`<button type="button" class="tile ${P.picked.includes(i)?"used":""}" data-t="${i}" ${P.picked.includes(i)?"disabled":""}>${ch}</button>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="btn ghost press" id="wClear">Clear</button><button class="btn ghost press" id="wSkip">Show first letter</button></div>`;
    }
  }
  openSheet(`<h2 id="shTitle">Weekly <em class="v">puzzles</em></h2><p class="sub">Week of ${dOf(pzWeek()).toLocaleDateString("en-GB",{day:"numeric",month:"long"})} · ${LVL[settings.age][0]} level</p>${tabs}${body}`, sh=>{
    sh.querySelectorAll("[data-tab]").forEach(b=> b.onclick=()=>{ P.tab=b.dataset.tab; renderPuzzles(); });
    sh.querySelectorAll(".cell").forEach(b=> b.onclick=()=>{ if(b.classList.contains("given")) { P.sel=[+b.dataset.r,+b.dataset.c]; renderPuzzles(); return; } P.sel=[+b.dataset.r,+b.dataset.c]; P.err=[]; renderPuzzles(); });
    sh.querySelectorAll("[data-v]").forEach(b=> b.onclick=()=>{ if(!P.sel) return; const [r,c]=P.sel; if(P.sd.p[r][c]) return; P.grid[r][c]=+b.dataset.v; P.err=[];
      if(P.grid.every((row,ri)=>row.every((v,ci)=>v===P.sd.s[ri][ci]))){ P.solvedS=true; P.sel=null; puzzleSolved("sudoku"); }
      renderPuzzles(); });
    const ck=sh.querySelector("#sdCheck"); if(ck) ck.onclick=()=>{ P.err=[]; P.grid.forEach((row,r)=>row.forEach((v,c)=>{ if(v&&v!==P.sd.s[r][c]) P.err.push([r,c]); })); const empty=P.grid.flat().filter(v=>!v).length; renderPuzzles(); const m=document.getElementById("sdMsg"); if(m) m.textContent=P.err.length?`${P.err.length} to fix, shown in red.`:empty?`So far so good. ${empty} left.`:""; };
    sh.querySelectorAll(".tile").forEach(b=> b.onclick=()=>{ const [w]=P.list[P.wi]; P.picked.push(+b.dataset.t); P.bad=false;
      if(P.picked.length===w.length){ const letters=scramble(w), guess=P.picked.map(i=>letters[i]).join(""); if(guess===w){ renderPuzzles(); setTimeout(()=>{ P.wi++; P.picked=[]; if(P.wi>=P.list.length){ P.solvedW=true; puzzleSolved("words"); } renderPuzzles(); },550); return; } P.bad=true; renderPuzzles(); setTimeout(()=>{ P.picked=[]; P.bad=false; renderPuzzles(); },650); return; }
      renderPuzzles(); });
    sh.querySelectorAll(".slot").forEach(b=> b.onclick=()=>{ const i=+b.dataset.u; if(i<P.picked.length){ P.picked=P.picked.slice(0,i); renderPuzzles(); } });
    const cl=sh.querySelector("#wClear"); if(cl) cl.onclick=()=>{ P.picked=[]; renderPuzzles(); };
    const sk=sh.querySelector("#wSkip"); if(sk) sk.onclick=()=>{ const [w]=P.list[P.wi], letters=scramble(w); const i=letters.findIndex((ch,k)=>ch===w[0]); P.picked=[i]; renderPuzzles(); };
  });
}

/* ---------- word-by-word body text ---------- */
const typedIds=new Set();
function typeIn(slide, id){
  const body=slide.querySelector(".cbody"); if(!body || body.dataset.typed) return;
  body.dataset.typed="1";
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce || typedIds.has(id) || settings.typing===false) return;
  typedIds.add(id);
  const step = settings.age==="x" ? 0.075 : 0.055; /* seconds per word: quick enough to follow, slow enough to read along */
  let t=0.35, n=0;
  body.classList.add("typed");
  body.querySelectorAll(":scope > p:not(.kicker)").forEach(p=>{
    p.classList.add("tp");
    [...p.childNodes].forEach(node=>{
      if(node.nodeType===3){
        const frag=document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(part=>{ if(!part) return; if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; } const s=document.createElement("span"); s.className="w"; s.style.setProperty("--d",(t+n*step).toFixed(3)+"s"); s.textContent=part; frag.appendChild(s); n++; });
        node.replaceWith(frag);
      } else if(node.nodeType===1){ node.classList.add("w"); node.style.setProperty("--d",(t+n*step).toFixed(3)+"s"); n++; }
    });
    t+=0.12;
  });
  const end=t+n*step;
  const kb=body.querySelector(".kbox"); if(kb){ kb.style.animationDelay=end.toFixed(2)+"s"; }
  /* tap anywhere in the story to show the rest at once */
  body.addEventListener("click", ()=> body.classList.add("all"), {once:true});
}

function moonInfo(){ const SYN=29.530588853, d=dOf(TODAY()); const t=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),15); let age=((t-Date.UTC(2000,0,6,18,14))/DAY)%SYN; if(age<0) age+=SYN; const f=age/SYN, lit=(1-Math.cos(2*Math.PI*f))/2;
  const names=[[1.2,"New moon"],[6.4,"Waxing crescent"],[8.4,"First quarter"],[13.6,"Waxing gibbous"],[15.9,"Full moon"],[21.1,"Waning gibbous"],[23.1,"Last quarter"],[28.3,"Waning crescent"],[30,"New moon"]]; const name=names.find(n=>age<n[0])[1];
  let toFull=SYN/2-age; if(toFull<0) toFull+=SYN; return {age,f,lit,name,toFull:Math.round(toFull),waxing:f<.5}; }
function moonSVG(m,south){ const r=44,c=50, rx=Math.abs(Math.cos(2*Math.PI*m.f))*r, gib=m.lit>.5; const flip=(m.waxing?1:-1)*(south?-1:1);
  return `<svg viewBox="0 0 100 100" class="moonpic" role="img" aria-label="${m.name}"><circle cx="50" cy="50" r="${r}" fill="#1B1A2B"/><path transform="translate(50 0) scale(${flip} 1) translate(-50 0)" fill="#F3EFD8" d="M${c} ${c-r} A${r} ${r} 0 0 1 ${c} ${c+r} A${rx.toFixed(2)} ${r} 0 0 ${gib?1:0} ${c} ${c-r}Z"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="#D9D6E8"/></svg>`; }
function openMoon(){ const m=moonInfo(), south=settings.country==="AU"; const pct=Math.round(m.lit*100);
  const why = m.name==="New moon"?"The moon is between Earth and the Sun, so its bright side faces away from us.":m.name==="Full moon"?"Earth is between the Sun and the moon, so we see the whole bright side.":m.waxing?"Each night this week you will see a little more of the bright side. That is called waxing.":"Each night this week you will see a little less of the bright side. That is called waning.";
  openSheet(`<span class="ttype" style="background:#E8E6FA;color:#3B2F8F">The sky tonight</span><h2 id="shTitle" style="margin-top:8px">${m.name}</h2>
    <div class="moonrow">${moonSVG(m,south)}<div><p><b>${pct}% lit.</b> ${why}</p><p class="sub" style="margin:0">Next full moon in about ${m.toFull} day${m.toFull===1?"":"s"}.</p></div></div>
    <div class="box think"><h4>Did you know?</h4><p>The moon makes no light of its own. It shines because sunlight bounces off it. ${south?"In Australia the moon looks upside down compared with how children in Europe see it.":"In Australia the same moon looks upside down, because people there stand the other way up on the globe."}</p></div>
    <p class="sub" style="margin-top:12px">Worked out for ${niceDate(TODAY())}. Look up after dark and check if it matches.</p>`); found("moon"); }

function wireToday(root){ root.querySelectorAll(".card.today.v2").forEach(card=>{ const sc=card.querySelector(".moms"), dots=[...card.querySelectorAll(".mdots i")]; if(!sc||sc.dataset.w) return; sc.dataset.w=1;
  const cur=()=>{ const w=sc.firstElementChild?sc.firstElementChild.offsetWidth+10:1; return Math.max(0,Math.min(dots.length-1,Math.round(sc.scrollLeft/w))); };
  sc.addEventListener("scroll",()=>{ const k=cur(); dots.forEach((d,i)=>d.classList.toggle("on",i===k)); if(k>0){ const h=card.querySelector(".mdots span"); if(h) h.style.opacity=0; } },{passive:true});
  const to=k=>{ const el=sc.children[k]; if(el) sc.scrollTo({left:el.offsetLeft-sc.offsetLeft,behavior:"smooth"}); };
  dots.forEach((d,i)=> d.onclick=e=>{ e.stopPropagation(); to(i); });
  sc.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){ e.stopPropagation(); to(cur()+1); } if(e.key==="ArrowLeft"){ e.stopPropagation(); to(cur()-1); } });
  sc.addEventListener("wheel",e=>{ if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) e.stopPropagation(); },{passive:true});

}); }

/* ===================== Sketch explainers ===================== */
const PENCIL='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
function sketchKey(id){ return (typeof SKETCH_FOR!=="undefined"&&SKETCH_FOR[id]&&SKETCHES[SKETCH_FOR[id]])?SKETCH_FOR[id]:null; }
function skRand(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296-.5; }; }
function skShape(e,rnd){ const j=k=>(rnd()*k), f=n=>n.toFixed(1);
  const line=(x1,y1,x2,y2)=>{ const len=Math.hypot(x2-x1,y2-y1), w=Math.min(5,len*.035+.8); return `M${f(x1+j(1.4))} ${f(y1+j(1.4))} Q${f((x1+x2)/2+j(w*2))} ${f((y1+y2)/2+j(w*2))} ${f(x2+j(1.4))} ${f(y2+j(1.4))}`; };
  if(e.l) return [line(...e.l)];
  if(e.r){ const [x,y,w,h]=e.r; return [line(x-1.5,y,x+w+1.5,y)+" "+line(x+w,y-1.5,x+w,y+h+1.5)+" "+line(x+w+1.5,y+h,x-1.5,y+h)+" "+line(x,y+h+1.5,x,y-1.5)]; }
  if(e.c){ const [cx,cy,r]=e.c; return [`M${f(cx-r)} ${f(cy+j(2))} a${f(r)} ${f(r+j(1.5))} 0 1 1 ${f(2*r)} ${f(j(1.5))} a${f(r+j(1.5))} ${f(r)} 0 1 1 ${f(-2*r+1.5)} ${f(2+j(1))}`]; }
  if(e.p) return [e.p];
  if(e.a){ const [x1,y1,x2,y2]=e.a, an=Math.atan2(y2-y1,x2-x1), h=7; return [line(x1,y1,x2,y2), `M${f(x2-h*Math.cos(an-.5))} ${f(y2-h*Math.sin(an-.5))} L${f(x2)} ${f(y2)} L${f(x2-h*Math.cos(an+.5))} ${f(y2-h*Math.sin(an+.5))}`]; }
  return []; }
function sketchSVG(key, upto, animate){ const S=SKETCHES[key]; let out="", n=0;
  S.steps.forEach((st,si)=>{ if(si>upto) return; const live=si===upto&&animate, rnd=skRand(key.length*977+si*131+7);
    st.d.forEach(e=>{ const col=e.acc?S.c:"#1F1E2A";
      if(e.t){ out+=`<text x="${e.t[0]}" y="${e.t[1]}" fill="${col}" class="${live?"sktx":""}" style="${live?`animation-delay:${(n*.16+.2).toFixed(2)}s`:""}">${esc(e.t[2])}</text>`; if(live) n++; return; }
      skShape(e,rnd).forEach(d=>{ out+=`<path d="${d}" pathLength="1" stroke="${col}" class="${live?"skink":""}" style="${live?`animation-delay:${(n*.16).toFixed(2)}s`:""}${si<upto?";opacity:.55":""}"/>`; if(live) n++; }); }); });
  return `<svg viewBox="0 0 320 220" class="skboard" role="img" aria-label="${esc(S.t)}, step ${upto+1}"><defs><filter id="skw" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter></defs><g filter="url(#skw)" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${out.replace(/<text/g,'<text stroke="none"')}</g></svg>`; }
function openSketch(key, step){ const S=SKETCHES[key]; if(!S) return; const i=step||0, st=S.steps[i], last=i===S.steps.length-1; const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  openSheet(`<span class="ttype" style="background:#F1F1F4;color:#3A3942">${PENCIL} Sketch it · step ${i+1} of ${S.steps.length}</span><h2 id="shTitle" style="margin-top:8px">${esc(S.t)}</h2>
    <button class="skpaper press" id="skRe" style="--sc:${S.c}" aria-label="Draw this step again">${sketchSVG(key,i,!reduce)}</button>
    <p class="skcap">${esc(settings.age==="x"?st.x:st.o)}</p>
    <div class="skdots" aria-hidden="true">${S.steps.map((x,k)=>`<i class="${k===i?"on":k<i?"done":""}"></i>`).join("")}</div>
    <div class="row"><button class="btn ghost press" id="skB" ${i?"":"disabled"}>Back</button><button class="btn sun press" id="skN" style="flex:1">${last?"Got it":"Next step"}</button></div>`,
    ()=>{ $("#skRe").onclick=()=>openSketch(key,i); $("#skB").onclick=()=>openSketch(key,i-1);
      $("#skN").onclick=()=>{ if(!last){ openSketch(key,i+1); return; } STATS.sketches=STATS.sketches||{}; const first=!STATS.sketches[key]; STATS.sketches[key]=1; saveStats(); closeSheet(); if(first) toast(`${PENCIL}<span><b>Sketch finished</b> · ${esc(S.t)}</span>`,S.c); checkAch(); document.querySelectorAll(`[data-sk="${key}"]`).forEach(b=>b.classList.add("seen")); };
      const f=$("#skN"); if(f) f.focus(); });
}

const EDITION_URL="https://raw.githubusercontent.com/aairacommit/FFMPA/main/editions/latest.json";
function applyEdition(E){
  if(!E||E.schema!==1||!Array.isArray(E.stories)||E.stories.length<5||!/^\d{4}-\d{2}-\d{2}$/.test(E.date||"")) return false;
  const bad=E.stories.find(s=>!s.id||!s.x||!s.o||!Array.isArray(s.x.b)||!Array.isArray(s.o.b)||!CATS[s.cat]); if(bad) return false;
  EDITION_DATE=E.date;
  S.splice(0,S.length,...E.stories);
  Object.assign(G,E.glossary||{});
  const swap=(obj,src)=>{ Object.keys(obj).forEach(k=>delete obj[k]); Object.assign(obj,src||{}); };
  swap(KEYS,E.keys); swap(XKEYS,E.xkeys); swap(DEEP,E.deep);
  if(E.today) ONTHISDAY[E.date]=E.today;
  if(E.learn) LEARN[E.date]=E.learn;
  Object.assign(SKETCHES,E.sketches||{}); swap(SKETCH_FOR,E.sketchFor);
  if(E.hiddenWords) HIDDEN_WORDS[E.date]=E.hiddenWords;
  if(E.backThen) BACKTHEN[E.date.slice(5)]=E.backThen;
  if(E.bigStory&&E.bigStory.week) BIGSTORY[E.bigStory.week]=E.bigStory;
  if(E.puzzles&&E.puzzles.week) PUZZLES[E.puzzles.week]=E.puzzles;
  if(E.reporters&&E.reporters.week) YR[E.reporters.week]=E.reporters;
  readIds=new Set(store.get("ffmpa-read-"+EDITION_DATE,[])); idx=0; topic="all"; typedIds.clear(); PZ=null;
  document.documentElement.dataset.edition=E.date+"-"+(E.edition||"am");
  renderAll(); return true;
}
async function loadLiveEdition(opts){

    /* Pick the edition for this family's own clock (6:00 am and 7:00 pm local, see schedule.js). */
    let pick=null, log=null;
    if(typeof SB_ON!=="undefined"&&SB_ON&&typeof sbEditionLog==="function"){
      log=await sbEditionLog(); if(log) pick=ffEditionFor(log,Date.now(),ffTz(),ADMIN.amTime,ADMIN.pmTime);
      if(!log&&cur) return;   /* schedule unreachable: keep what is showing rather than guess */
    }
    const get=async url=>{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),6000);
      try{ const r=await fetch(url+"?h="+Math.floor(Date.now()/3e5),{signal:ctl.signal,cache:"no-store"}); return r.ok?await r.json():null; }finally{ clearTimeout(tm); } };
    if(pick&&cur===pick.id){ if(window.FF_SLOT!==pick.slot){ window.FF_SLOT=pick.slot; renderTop(); } return; }
    /* never step back to an older edition unless the newer one was rolled back (no longer in the log) */
    if(pick&&cur&&cur>pick.id&&log.some(e=>e.id===cur)) return;
    let E=pick?await get(EDITION_URL.replace("latest.json",pick.id+".json")):null;
    if(!E||(E.date+"-"+(E.edition||"am"))!==(pick&&pick.id)){ if(cur) return; E=await get(EDITION_URL); pick=null; }
    if(!E||!E.date) return;
    const id=E.date+"-"+(E.edition||"am");
    if(cur===id) return;
    if(!pick&&cur&&E.date<EDITION_DATE) return;
    /* a new edition while a child is in the middle of reading waits until the app is opened again */
    if(cur&&opts&&opts.background&&typeof idx!=="undefined"&&idx>0){ window.FF_PENDING=true; return; }
    window.FF_SLOT=pick?pick.slot:((E.edition==="pm")?"pm":"am"); window.FF_PENDING=false;
    applyEdition(E);
  }catch(e){}
}

(function(){ const el=document.getElementById("splash"); if(!el) return;
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true||document.referrer.startsWith("android-app://");
  let seen=false; try{ seen=sessionStorage.getItem("ffmpa-splash")==="1"; sessionStorage.setItem("ffmpa-splash","1"); }catch(e){}
  if(seen&&!standalone){ el.classList.add("gone"); return; }
  const lines=["Waking up the newsroom…","Checking every fact twice…","Sharpening the pencils…","Asking the editor…","Spinning up the globe…","Finding today's big story…"];
  const ln=el.querySelector(".spline"), bar=el.querySelector(".spbar i"); let li=0;
  const tick=setInterval(()=>{ li=(li+1)%lines.length; if(ln) ln.textContent=lines[li]; },750);
  const t0=performance.now(), MIN=standalone?2300:1900, MAX=4200; let done=false;
  setTimeout(()=>{ if(bar) bar.style.width="70%"; },200);
  const finish=()=>{ if(done) return; done=true; clearInterval(tick); if(bar) bar.style.width="100%"; if(ln) ln.textContent=window.__edReady?"Today's edition is ready!":"Here's the latest edition";
    setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.classList.add("gone"),750); },260); };
  const whenReady=()=>setTimeout(finish,Math.max(0,MIN-(performance.now()-t0)));
  if(window.__edReady) whenReady(); else addEventListener("ffmpa:edition",whenReady,{once:true});
  setTimeout(finish,MAX);
  el.addEventListener("click",()=>{ if(performance.now()-t0>600) finish(); });
})();

        <td><span class="status st-${r.st}">${({published:"Published",draft:"In review",rejected:"Rejected",held:"Held by filter",stale:"Expired"})[r.st]}</span></td>
        <td>${(r.st==="held"||r.st==="stale")?"<small>Not publishable</small>":`<select data-id="${r.s.id}" aria-label="Set status for ${esc(r.s.o.t)}"><option value="published" ${r.st==="published"?"selected":""}>Publish</option><option value="draft" ${r.st==="draft"?"selected":""}>Back to review</option><option value="rejected" ${r.st==="rejected"?"selected":""}>Reject</option></select>`}</td></tr>`).join("")}
      </tbody></table></div></div>
      <div class="panel"><h2>Story record (what each daily run writes to Supabase)</h2><div class="code">${esc(JSON.stringify({id:"g-sky", edition_date:"2026-11-11", edition_slot:"am", scope:"global", category:"space", published_at_source:"2026-11-10", kind:"news",
        explorers:{title:"Look up! Shooting stars and planets this week", body:["..."]}, thinkers:{title:"Skywatch week: ...", body:["..."]},
        image:{url:"https://images.ffmpa.com/2026/11/g-sky.jpg", credit:"NASA/JPL-Caltech", license:"Public domain (NASA media policy)"},
        sources:[{name:"Space.com", url:"https://..."}], glossary_terms:["meteor-shower","fireball"], quiz:{q:"...", a:["..."], correct:0},
        status:"in_review", filter_result:"clear"},null,2))}</div></div>`;
    m.querySelectorAll("select[data-id]").forEach(sel=> sel.onchange=()=>{ ADMIN.storyStatus[sel.dataset.id]=sel.value; saveAdmin(); renderAdmin(); });
  }
  if(admSection==="editions"){
    m.innerHTML=`<h1>Editions</h1><p class="sub">Times are local to each country.</p>
      <div class="panel"><h2>Schedule and freshness</h2><div class="toggles">
        <label class="field" for="aAm">Morning edition time<input type="text" id="aAm" value="${ADMIN.amTime}" pattern="\\d{2}:\\d{2}"></label>
        <label class="field" for="aPm">Evening edition time<input type="text" id="aPm" value="${ADMIN.pmTime}" pattern="\\d{2}:\\d{2}"></label>
        <label class="field" for="aFresh">Freshness window: <b id="aFreshV">${ADMIN.freshHours} hours</b><input type="range" id="aFresh" min="24" max="96" step="12" value="${ADMIN.freshHours}"></label>
        <label class="field" for="aMax">Most stories per edition: <b id="aMaxV">${ADMIN.maxStories}</b><input type="range" id="aMax" min="8" max="25" value="${ADMIN.maxStories}"></label></div></div>
      <div class="panel"><h2>Countries</h2><div class="toggles">${Object.entries(COUNTRIES).map(([k,c])=>`<label class="tg" for="ac-${k}"><input type="checkbox" id="ac-${k}" data-cty="${k}" ${ADMIN.countries[k]?"checked":""}> ${c.name}</label>`).join("")}</div><p class="sub" style="margin:10px 0 0">Adding a country means adding its news sources, time zone and a local editor to the pipeline.</p></div>
      <div class="row"><button class="btn sun press" id="aSave">Save editions</button><span class="msg" id="aMsg" aria-live="polite"></span></div>`;
    $("#aFresh").oninput=e=>$("#aFreshV").textContent=e.target.value+" hours"; $("#aMax").oninput=e=>$("#aMaxV").textContent=e.target.value;
    $("#aSave").onclick=()=>{ const re=/^([01]\d|2[0-3]):[0-5]\d$/; if(!re.test($("#aAm").value)||!re.test($("#aPm").value)){ $("#aMsg").textContent="Use 24-hour times like 06:00 and 19:00."; return; }
      ADMIN.amTime=$("#aAm").value; ADMIN.pmTime=$("#aPm").value; ADMIN.freshHours=+$("#aFresh").value; ADMIN.maxStories=+$("#aMax").value; m.querySelectorAll("[data-cty]").forEach(c=> ADMIN.countries[c.dataset.cty]=c.checked); saveAdmin(); $("#aMsg").textContent="Saved. The app now uses these settings."; };
  }
  if(admSection==="safety"){
    m.innerHTML=`<h1>Language and safety</h1><p class="sub">Any story containing a blocked word is held automatically and cannot be published until an editor rewrites it. Try adding the word smog and check the India edition.</p>
      <div class="panel"><h2>Blocked words and phrases</h2><div class="tagin" id="bw">${ADMIN.blockedWords.map((w,i)=>`<span>${esc(w)}<button data-del="${i}" aria-label="Remove ${esc(w)}">✕</button></span>`).join("")}</div>
        <div class="row" style="margin-top:12px"><label class="field" for="bwIn" style="flex:1">Add a word<input type="text" id="bwIn" placeholder="e.g. scary"></label><button class="btn press" id="bwAdd" style="align-self:flex-end">Add</button></div>
        <p class="sub" style="margin:10px 0 0">The production list holds several hundred terms, including profanity and slurs in English and common transliterations, and is kept in Supabase so the pipeline and the app share one list.</p></div>
      <div class="panel"><h2>Rules every draft is checked against</h2><ul style="margin:0;padding-left:20px"><li>No graphic detail of violence, injury, crime or death</li><li>No fear words or sensational headlines</li><li>No naming of victims, suspects or children</li><li>Explorers: no war or conflict stories</li><li>Politics: neutral wording, same tone for every side</li><li>Every fact in at least two reputable sources</li></ul><p style="margin:10px 0 0"><a href="#safety">Read the public content and safety standards</a></p></div>`;
    m.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ ADMIN.blockedWords.splice(+b.dataset.del,1); saveAdmin(); renderAdmin(); });
    $("#bwAdd").onclick=()=>{ const w=$("#bwIn").value.trim().toLowerCase(); if(!w||ADMIN.blockedWords.includes(w)) return; ADMIN.blockedWords.push(w); saveAdmin(); renderAdmin(); };
  }
  if(admSection==="ads"){
    const a=ADMIN.ads;
    m.innerHTML=`<h1>Ads and sponsors</h1><p class="sub">Contextual only: the same message for every child in a country, never based on who the child is or what they read. Targeted advertising to children is prohibited under India's DPDP Act.</p>
      <div class="panel"><h2>Placement</h2><div class="toggles">
        <label class="tg" for="adOn"><input type="checkbox" id="adOn" ${a.enabled?"checked":""}> Show sponsor cards</label>
        <label class="tg" for="adX"><input type="checkbox" id="adX" ${a.explorers?"checked":""}> Also show to Explorers (5 to 9)</label>
        <label class="field" for="adEvery">Stories between sponsor cards: <b id="adEveryV">${a.every}</b><input type="range" id="adEvery" min="3" max="10" value="${a.every}"></label>
        <label class="field" for="adMax">Most cards per edition: <b id="adMaxV">${a.maxPerEdition}</b><input type="range" id="adMax" min="0" max="4" value="${a.maxPerEdition}"></label></div></div>
      <div class="panel"><h2>Ad sources</h2><div class="toggles">
        <label class="tg" for="srcD"><input type="checkbox" id="srcD" ${a.sources.direct?"checked":""}> Direct sponsors (approved below)</label>
        <label class="tg" for="srcS"><input type="checkbox" id="srcS" ${a.sources.superawesome?"checked":""}> Kid-safe network (e.g. SuperAwesome)</label>
        <label class="tg" for="srcG"><input type="checkbox" id="srcG" ${a.sources.adsense?"checked":""}> Google AdSense, child-directed</label></div>
        <p class="sub" style="margin:10px 0 0">Google's child-directed tag turns off interest-based ads and remarketing, but it does not by itself make the creative child-appropriate, so Google stays off by default and needs category blocking and review before use. The Android app must also follow Google Play's Families policy.</p>
        ${a.sources.adsense?`<div class="code">&lt;ins class="adsbygoogle"
  data-ad-client="ca-pub-XXXXXXXXXXXX"
  data-ad-slot="XXXXXXXXXX"
  data-tag-for-child-directed-treatment="1"&gt;&lt;/ins&gt;</div>`:""}</div>
      <div class="panel"><h2>Blocked ad categories</h2><div class="tagin">${a.blocked.map(b=>`<span>${esc(b)}</span>`).join("")}</div></div>
      <div class="panel"><h2>Sponsor cards</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Sponsor message</th><th>Countries</th><th>Status</th><th>Action</th></tr></thead><tbody>
        ${ADMIN.sponsors.map(s=>`<tr><td><b>${esc(s.headline)}</b><br><small>${esc(s.name)}</small>${s.note?`<br><small style="color:#9B2C1F">${esc(s.note)}</small>`:""}</td><td>${s.countries.join(", ")}</td><td><span class="status st-${s.status==="approved"?"published":s.status==="rejected"?"rejected":"draft"}">${s.status}</span></td>
          <td><select data-sp="${s.id}" aria-label="Status for ${esc(s.headline)}"><option value="approved" ${s.status==="approved"?"selected":""}>Approve</option><option value="pending" ${s.status==="pending"?"selected":""}>Pending</option><option value="rejected" ${s.status==="rejected"?"selected":""}>Reject</option></select></td></tr>`).join("")}</tbody></table></div></div>
      <div class="row"><button class="btn sun press" id="adSave">Save ad settings</button><span class="msg" id="adMsg" aria-live="polite"></span></div>`;
    $("#adEvery").oninput=e=>$("#adEveryV").textContent=e.target.value; $("#adMax").oninput=e=>$("#adMaxV").textContent=e.target.value;
    $("#srcG").onchange=()=>{ a.sources.adsense=$("#srcG").checked; renderAdmin(); };
    m.querySelectorAll("[data-sp]").forEach(sel=> sel.onchange=()=>{ const s=ADMIN.sponsors.find(x=>x.id===sel.dataset.sp); s.status=sel.value; });
    $("#adSave").onclick=()=>{ Object.assign(a,{enabled:$("#adOn").checked, explorers:$("#adX").checked, every:+$("#adEvery").value, maxPerEdition:+$("#adMax").value}); Object.assign(a.sources,{direct:$("#srcD").checked, superawesome:$("#srcS").checked, adsense:$("#srcG").checked}); saveAdmin(); $("#adMsg").textContent="Saved. Swipe the app to see sponsor cards."; };
  }
  if(admSection==="plans"){
    const p=ADMIN.plan;
    m.innerHTML=`<h1>Plans and pricing</h1><p class="sub">FFMPA stays free until you switch this on. Families who join while it is free can be kept free for life as early supporters.</p>
      <div class="panel"><h2>Mode</h2><div class="toggles">
        <label class="tg" for="plFree"><input type="radio" name="plMode" id="plFree" value="free" ${p.mode==="free"?"checked":""}> Free for everyone (now)</label>
        <label class="tg" for="plPaid"><input type="radio" name="plMode" id="plPaid" value="paid" ${p.mode==="paid"?"checked":""}> Paid, with a free trial</label>
        <label class="tg" for="plEarly"><input type="checkbox" id="plEarly" ${p.keepFreeForEarly?"checked":""}> Keep families who joined during the free period free for life</label></div></div>
      <div class="panel"><h2>Prices (per family, per year)</h2><div class="toggles">
        <label class="field" for="plIN">India (₹)<input type="number" id="plIN" min="0" value="${p.priceIN}"></label>
        <label class="field" for="plIntl">All other countries (US$)<input type="number" id="plIntl" min="0" step="0.5" value="${p.priceIntl}"></label>
        <label class="field" for="plTrial">Free trial (days)<input type="number" id="plTrial" min="0" max="60" value="${p.trialDays}"></label></div>
        <p class="sub" style="margin:10px 0 0">One plan covers every child on the parent's account.</p></div>
      <div class="panel"><h2>Payment gateways</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Region</th><th>Gateway</th><th>Status</th></tr></thead><tbody>
        <tr><td>India (UPI, cards, netbanking)</td><td><select id="plGIN"><option value="razorpay" ${p.gatewayIN==="razorpay"?"selected":""}>Razorpay</option><option value="stripe" ${p.gatewayIN==="stripe"?"selected":""}>Stripe</option></select></td><td><span class="status st-draft">Keys added at launch</span></td></tr>
        <tr><td>All other countries</td><td><select id="plGX"><option value="stripe" ${p.gatewayIntl==="stripe"?"selected":""}>Stripe</option><option value="razorpay" ${p.gatewayIntl==="razorpay"?"selected":""}>Razorpay</option></select></td><td><span class="status st-draft">Keys added at launch</span></td></tr></tbody></table></div>
        <p class="sub" style="margin:10px 0 0">Payments are taken from the grown-up only, inside the PIN-protected area. Children never see a payment screen. In the Android app, Google Play's billing rules may apply.</p></div>
      <div class="panel"><h2>What families see when paid</h2><p style="margin:0">India: <b>${priceText("IN")}</b> after ${p.trialDays} free days. Elsewhere: <b>${priceText("US")}</b>. When a trial ends, the child sees a friendly card asking them to fetch a grown-up.</p></div>
      <div class="row"><button class="btn sun press" id="plSave">Save pricing</button><span class="msg" id="plMsg" aria-live="polite"></span></div>`;
    $("#plSave").onclick=()=>{ p.mode=document.querySelector('input[name="plMode"]:checked').value; p.keepFreeForEarly=$("#plEarly").checked; p.priceIN=+$("#plIN").value||0; p.priceIntl=+$("#plIntl").value||0; p.trialDays=+$("#plTrial").value||0; p.gatewayIN=$("#plGIN").value; p.gatewayIntl=$("#plGX").value; saveAdmin(); $("#plMsg").textContent = p.mode==="paid" ? "Saved. Paid mode is on in this browser." : "Saved. FFMPA is free for everyone."; };
  }
  if(admSection==="extras"){
    const wk=mondayOf(TODAY()), pz=PUZZLES[wk];
    m.innerHTML=`<h1>Puzzles, crafts and today</h1><p class="sub">The daily pipeline drafts these; editors approve them like stories.</p>
      <div class="panel"><h2>Today card · ${niceDate(TODAY())}</h2>${(()=>{const t=ONTHISDAY[TODAY()]; return t?`<p style="margin:0 0 6px"><b>Born today:</b> ${t.born.map(b=>esc(b.name)+" ("+b.year+")").join(", ")}</p><p style="margin:0"><b>Days:</b> ${t.days.map(d=>esc(d.name)+(d.where?" ["+d.where.join(", ")+"]":"")).join(" · ")}</p>`:"<p>No entries for today yet.</p>";})()}</div>
      ${findsAdminHTML()}<div class="panel"><h2>Learn one thing · this week</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Day</th><th>Subject</th><th>Concept</th></tr></thead><tbody>${LEARN_WEEK.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div><p class="sub" style="margin:10px 0 0">One concept a day, rotating history, geography and science, linked to a story in the edition where possible.</p></div>
      <div class="panel"><h2>This week's puzzles · from ${shortDate(wk)}</h2>${pz?`<p style="margin:0 0 6px"><b>Mini sudoku:</b> 9×9 for Navigators, 6×6 for Thinkers, 4×4 for Explorers (single solution checked).</p><p style="margin:0"><b>News words:</b> ${pz.words.o.map(w=>w[0]).join(", ")} · Explorers: ${pz.words.x.map(w=>w[0]).join(", ")}</p>`:"<p>None scheduled.</p>"}</div>
      <div class="panel"><h2>Sunday crafts · year one (${CRAFTS.length})</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>#</th><th>Sunday</th><th>Craft</th><th>Theme</th><th>Grown-up</th></tr></thead><tbody>${CRAFTS.map((c,i)=>`<tr><td>${i+1}</td><td>${shortDate(addDays(CRAFT_START,7*i))}</td><td>${esc(c.t)}</td><td>${esc(c.th)}</td><td>${c.g?"Yes":""}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  if(admSection==="pipeline"){
    m.innerHTML=`<h1>Daily pipeline</h1><p class="sub">Scheduled Claude sessions research and draft each edition, then push drafts to Supabase for editor review.</p>
      <div class="panel"><h2>Each run, twice a day per country</h2><ol style="margin:0;padding-left:20px;line-height:1.7">
        <li>Collect: search trusted sources for news first reported in the last ${ADMIN.freshHours} hours, for the country and the world.</li>
        <li>Select: pick 12 to 20 stories by importance, variety and child relevance; drop blocked topics.</li>
        <li>Verify: confirm each fact in two sources; record source links and dates.</li>
        <li>Write: Explorers and Thinkers versions, the Navigators deeper layer (context, question, jobs), glossary terms, a Think about it question and a quiz question.</li>
        <li>Image: attach only a free-to-use photo (public domain, Creative Commons, or an official press or government library) and record its credit and licence. If none exists, the story runs with its colour band and no photo.</li>
        <li>Screen: run the blocked word list and safety rules; flag anything borderline.</li>
        <li>Push: insert rows into Supabase with status in_review.</li>
        <li>Review: an editor approves in this console; approved stories publish at the edition time.</li></ol></div>
      <div class="panel"><h2>Run log (sample)</h2><div class="tablewrap"><table class="adm-table"><thead><tr><th>Run</th><th>Drafted</th><th>Held</th><th>Approved</th><th>Result</th></tr></thead><tbody>
        ${Object.entries(COUNTRIES).filter(([k])=>ADMIN.countries[k]).map(([k,c])=>{ const r=rows.filter(x=>x.s.scope===k||x.s.scope==="global"); return `<tr><td>11 Nov · Morning · ${c.short}</td><td>${r.length}</td><td>${r.filter(x=>x.st==="held").length}</td><td>${r.filter(x=>x.st==="published").length}</td><td><span class="status st-published">Published 6:00 AM ${c.tz}</span></td></tr>`; }).join("")}
        <tr><td>11 Nov · Evening · all</td><td>Scheduled</td><td>·</td><td>·</td><td><span class="status st-draft">Runs 6:15 PM local</span></td></tr></tbody></table></div></div>`;
  }
}

/* ================= Routing ================= */
function route(){
  const k=location.hash.replace("#","");
  if(k==="admin"){ openAdmin(); return; }
  if($("#adminView").classList.contains("open")&&k!=="admin"&&!LEGAL[k]) closeAdmin();
  if(LEGAL[k]) renderLegal(k); else if($("#legalOv").classList.contains("open")) $("#legalOv").classList.remove("open");
}
window.addEventListener("hashchange", route);

/* ================= Boot ================= */
renderAll();
if(SB_ON && session && !session.preview && !(session.uid && store.get(AUTH_KEY,null))){ session=null; _sdel("ffmpa-session"); }
if(location.hash!=="#admin" && (!session||session.preview)){ session=null; startWelcome("email"); }
route();
sbBoot();
</script>
</body>
</html>
